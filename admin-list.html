<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Gerencie os brinquedos de uma lista de presentes da Happy Kids."
    />
    <title>Gerenciar lista | Happy Kids</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/base.css" />
    <link rel="stylesheet" href="./css/layout.css" />
    <link rel="stylesheet" href="./css/components.css" />
    <link rel="stylesheet" href="./css/admin.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="./js/pages/admin-list.js"></script>
  </head>
  <body>
    <main class="site-shell">
      <a class="text-link" href="./admin.html">← Voltar para as listas</a>

      <header class="page-intro admin-header detail-header">
        <p class="eyebrow">Happy Kids  Brinquedos</p>
        <h1 id="list-name">Carregando lista…</h1>
        <p id="list-date">Aguarde um instante.</p>
      </header>

      <p id="admin-list-feedback" class="feedback" role="status" aria-live="polite">
        Verificando acesso…
      </p>

      <section id="list-management" hidden>
        <nav class="action-group" aria-label="Ações da lista">
          <button id="copy-public-link" class="button button-secondary" type="button">
            Copiar link
          </button>
          <a
            id="open-public-list"
            class="button button-secondary"
            href="./lista.html"
            target="_blank"
            rel="noopener noreferrer"
          >
            Abrir lista
          </a>
          <button id="delete-list" class="button button-delete" type="button">
            Excluir lista
          </button>
        </nav>

        <section class="admin-panel" aria-labelledby="new-item-title">
          <h2 id="new-item-title">Adicionar brinquedo</h2>
          <p class="panel-description" style="margin-bottom: 2rem;">
            Escolha uma foto já capturada ou use a câmera para capturar em tempo real.
          </p>

          <form id="new-item-form" class="form-stack">
            <div class="field-group">
              <span class="field-label">Foto do brinquedo</span>
              <div class="photo-actions">
                <label class="button button-secondary" for="gallery-image-input">
                  Escolher da galeria 🖼️
                </label>
                <label class="button button-secondary" for="camera-image-input">
                  Tirar foto agora 📷
                </label>
              </div>
              <input
                id="gallery-image-input"
                class="visually-hidden"
                type="file"
                accept="image/*"
              />
              <input
                id="camera-image-input"
                class="visually-hidden"
                type="file"
                accept="image/*"
                capture="environment"
              />
            </div>

            <section id="photo-preview" class="photo-preview" hidden aria-label="Prévia da foto">
              <img id="photo-preview-image" alt="Prévia da foto selecionada" />
              <div>
                <p id="photo-file-name"></p>
                <p id="photo-file-details" class="panel-description"></p>
                <button id="remove-selected-photo" class="text-button" type="button">
                  Remover foto
                </button>
              </div>
            </section>

            <div class="field-group">
              <label for="item-title">Nome do brinquedo</label>
              <input id="item-title" name="title" type="text" minlength="2" maxlength="160" required />
            </div>
            <div class="field-group">
              <label for="item-price">Preço <span class="optional-label">(opcional)</span></label>
              <input id="item-price" name="price" type="number" min="0" step="0.01" inputmode="decimal" />
            </div>
            <button id="new-item-submit" class="button button-primary" type="submit">
              Adicionar brinquedo
            </button>
          </form>
        </section>

        <section class="admin-panel items-panel" aria-labelledby="items-title">
          <h2 id="items-title">Brinquedos da lista</h2>
          <p id="items-empty-state" class="panel-description">Carregando brinquedos…</p>
          <ul id="items-list" class="item-management-list" aria-live="polite"></ul>
        </section>
      </section>
    </main>
  </body>
</html>
